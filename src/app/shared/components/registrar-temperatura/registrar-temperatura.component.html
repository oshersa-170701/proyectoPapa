<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-azul-premium">
    <!-- 🚀 Título cambiado a clase blanca -->
    <ion-title class="medical-title-white">Registrar Temperatura</ion-title>
    <ion-buttons slot="end">
      <!-- 🚀 Botón de cerrar cambiado a clase blanca -->
      <ion-button (click)="cerrarModal()" [disabled]="cargando" class="btn-cerrar-blanco">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="medical-bg ion-padding">
  <div class="vitals-container">
    
    <!-- Tarjeta Médica para Ingreso de Temperatura -->
    <div class="vital-card vital-card-temp">
      <div class="card-header">
        <ion-icon name="thermometer-outline"></ion-icon>
        <h3>Monitoreo Corporal</h3>
      </div>
      
      <div class="card-body">
        <span class="value">{{ temperaturaInput || '0.0' }}</span>
        <span class="unit">°C</span>
      </div>

      <!-- Input de Ionic Estilizado -->
      <ion-item lines="none" class="input-medico">
        <ion-label position="stacked">Temperatura del Paciente</ion-label>
        <ion-input 
          type="number" 
          min="30" 
          max="45" 
          step="0.1"
          [(ngModel)]="temperaturaInput"
          [disabled]="cargando">
        </ion-input>
      </ion-item>
    </div>

    <!-- Indicador de Carga -->
    @if (cargando) {
      <div class="loading-state">
        <ion-spinner name="crescent" class="spinner-animate"></ion-spinner>
        <h3>Guardando en ANAasis...</h3>
        <p>Sincronizando de forma segura con el servidor médico.</p>
      </div>
    }

    <!-- Botón de Acción Estilizado -->
    @if (!cargando) {
      <div class="contenedor-acciones">
        <ion-button 
          expand="block" 
          color="success"
          class="medical-btn-premium"
          (click)="guardarTemperatura()">
          <ion-icon slot="start" name="save-outline" class="icono-blanco"></ion-icon>
          <span class="texto-blanco">Guardar Registro</span>
        </ion-button>
      </div>
    }

  </div>
</ion-content>
