// Archivo: android/app/build.gradle
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android' // 📍 AÑADE ESTA LÍNEA AQUÍ

// 🔑 Credenciales del keystore de RELEASE. Viven en android/keystore.properties,
// que NO se sube a git (a diferencia del keystore de debug). Así Android Studio
// firma "producción" siempre con la misma llave sin pasar por el asistente manual.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.warn("⚠️  android/keystore.properties no existe: el build de RELEASE quedará SIN FIRMAR. Pide el archivo a quien lo generó.")
}

android {
    namespace "com.anaasis.vitals.daniel" // Asegúrate que coincida con tu id de app
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.anaasis.vitals.daniel"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 🔑 Firma de debug FIJA y compartida (android/app/debug.keystore, versionada en git).
    // Sin esto, cada máquina genera su propio keystore de debug automático en ~/.android/debug.keystore,
    // y un celular que ya tenga una versión instalada con otra firma rechaza instalar la nueva ("app no instalada").
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}